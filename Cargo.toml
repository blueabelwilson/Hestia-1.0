[package]
name = "hestia"
version = "1.0.0"
edition = "2021"
description = "A friendly, themeable rofi-style launcher for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/blueabelwilson/Hestia-1.0"
homepage = "https://github.com/blueabelwilson/Hestia-1.0"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
resvg = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
global-hotkey = "0.6"
tray-icon = "0.19"
rfd = "0.15"
winreg = "0.52"
walkdir = "2"
ttf-parser = "0.25"
window-vibrancy = "0.5"
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized even in debug builds so image/SVG work stays snappy.
[profile.dev.package."*"]
opt-level = 2
